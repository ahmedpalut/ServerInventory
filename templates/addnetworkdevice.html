<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ translations.add_network_device }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="top-bar">

            <h1 id="title">{{ translations.add_network_device }}</h1>

            <a href="/change_language/{{ 'en' if lang == 'tr' else 'tr' }}" id="langButton">
                {{ 'EN' if lang == 'tr' else 'TR' }}
            </a>

        </div>


        <form action="/addnetworkdevice" method="POST">


            <label>{{ translations.device_name }}</label>
            <input type="text" name="name" required>


            <label>{{ translations.type }}</label>

            <select name="device_type" class="beautifySelect" required id="net_device_type">

                <option value="" selected disabled>{{ translations.select_device_type }}</option>

                <option value="Switch">Switch</option>
                <option value="Router">Router</option>
                <option value="Firewall">Firewall</option>
                <option value="Access Point">Access Point</option>
                <option value="Modem">Modem</option>

                {% for device_type in device_types %}
                <option value="{{ device_type }}">{{ device_type }}</option>
                {% endfor %}

                <option value="Diğer">{{ translations.new }}</option>

            </select>

            <div id="otherDeviceTypeContainer" style="display: none; margin-top: 10px;">
                <input type="text" name="other_device_type" id="otherDeviceType" placeholder="{{ translations.enter_new_device_type }}"
                    class="beautifyInput">
            </div>


            <label>{{ translations.brand }}</label>
            <input type="text" name="brand">


            <label>{{ translations.model }}</label>
            <input type="text" name="model">


            <label>{{ translations.serial_number }}</label>
            <input type="text" name="serial_number">


            <label>{{ translations.ip_address }}</label>
            <input type="text" name="ip_address">


            <label>{{ translations.mac_address }}</label>
            <input type="text" name="mac_address">


            <label>{{ translations.location }}</label>
            <input type="text" name="location">


            <label>{{ translations.status }}</label>

            <select name="status" class="beautifySelect">

                <option value="Aktif">{{ translations.active }}</option>
                <option value="Pasif">{{ translations.passive }}</option>
                <option value="Bakımda">{{ translations.maintenance }}</option>
                <option value="Arızalı">{{ translations.faulty }}</option>

            </select>


            <label>{{ translations.software_version }}</label>
            <input type="text" name="software_version">


            <label>{{ translations.date }}</label>
            <input type="date" name="created_at">


            <label>{{ translations.description }}</label>
            <input type="text" name="description">


            <div class="buttons">

                <button type="submit" id="saveBtn">
                    {{ translations.add }}
                </button>

                <a href="/networkdevices" id="cancelBtn">
                    {{ translations.cancel }}
                </a>

            </div>


        </form>

    </div>

    <script src="{{url_for('static', filename='js/addnetworkdevice.js')}}"></script>
</body>

</html>
