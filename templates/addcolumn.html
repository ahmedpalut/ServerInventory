<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Yeni Sütun Ekle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div id="toast">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}

    <div class="container">
        <div class="top-bar">
            <h1 id="title">Yeni Sütun Ekle</h1>

            <button type="button" id="langButton">
                TR / EN
            </button>
        </div>
            
            <form action="/addcolumn" method="POST"> 

                <label id="colNameLabel">Sütun Adı</label>
                <input type="text" name="colName" required>

                <label id="dataTypeLabel">Veri Tipi</label>
                <select name="dataType" class="beautifySelect">
                    <option value="TEXT">TEXT</option>
                    <option value="INTEGER">INTEGER</option>
                    <option value="DECIMAL">DECIMAL</option>
                    <option value="DATE">DATE</option>
                    <option value="BOOLEAN">BOOLEAN</option>
                </select>

                <div class="buttons">
                    <button type="submit" id="saveColumnBtn">Ekle</button>

                    <a href="/" id="cancelColumnBtn">İptal</a>
                </div>
            </form>    
    </div>
        
        <script src="{{url_for('static', filename='js/TranslateFiles/addcolumnTranslate.js')}}"></script>
        <script src="{{ url_for('static', filename='js/addcolumn.js')}}"> </script>
        
</body>

</html>
